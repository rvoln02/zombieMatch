
<div class="confetti-wrapper"></div>

<h3 style="color: white;">Score: {{ score }} | Moves: {{ moveCount }} </h3>
<div class="grid-container">
  @for (card of cards; track $index) {
    <!-- EMPTY BOX -->
    @if(card.isHidden){
    <div class="grid-item" (click)="onCardClick(card, $index)" style="background-color: grey;"></div>
    }
    <!-- LOCKED -->
    @else if(card.isLocked){
    <div class="grid-item" style="background-color: green; cursor: default;">
      <img [src]="card.url" style="filter: sepia(100%) hue-rotate(90deg) saturate(400%); "/>
    </div>
    }
    <!-- ACTIVE -->
    @else{
    <div class="grid-item" style="cursor: default;">
      <img [src]="card.url"/>
    </div>
    }
  }
</div>

@if(score == pictureCount){
  <div class="restart-container">
    <button (click)="restartGame()"> Restart </button>
  </div>
}
